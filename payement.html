<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="Choose a payment method and amount">
  <title>Payment — Roblox Portfolio</title>
  <script src="payment-enhancements.js?v=20260815-4"></script>
  <link rel="stylesheet" href="styles.css?v=20260815-4">
  <script src="translation.js?v=20260815-4" defer></script>
  <script src="script.js?v=20260815-4" defer></script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>
</head>
<body>
  <div class="gtranslate_wrapper" aria-hidden="true"></div>
  <div class="page-shell payment-shell">
    <header class="site-header">
      <button class="menu-button" aria-expanded="false" aria-controls="main-navigation">Menu</button>
      <nav id="main-navigation" aria-label="Main navigation">
        <a href="index.html">Homepage</a><a href="build.html">Build</a><a href="contribution.html">Commissions</a><a href="socials.html">Socials</a><a class="active" href="payement.html">Payment</a><button class="language-toggle notranslate" translate="no" type="button" aria-label="Switch between French and English"><span data-lang="fr">FR</span><i>/</i><span data-lang="en">ENG</span></button>
      </nav>
    </header>

    <main class="payment-page">
      <header class="payment-heading">
        <p>PAYMENT / COMMISSION</p>
        <h1>Payment</h1>
      </header>

      <section class="payment-step method-step">
        <h2><span>1.</span> Select payment method:</h2>
        <div class="payment-methods" role="tablist" aria-label="Payment methods">
          <button class="payment-method active" id="tab-robux" role="tab" aria-selected="true" aria-controls="panel-robux" data-payment-tab="robux"><i></i><span>Robux</span><img class="payment-logo robux-logo" src="assets/robux-payment-logo.png?v=2" alt="" aria-hidden="true"></button>
          <button class="payment-method" id="tab-paypal" role="tab" aria-selected="false" aria-controls="panel-paypal" data-payment-tab="paypal"><i></i><span>PayPal</span><img class="payment-logo paypal-logo" src="assets/paypal-payment-logo.png?v=2" alt="" aria-hidden="true"></button>
          <button class="payment-method coming" type="button" disabled><i></i><span>Credit Card <small>soon</small></span><img class="payment-logo card-logo" src="assets/card-payment-logo.png?v=2" alt="" aria-hidden="true"></button>
        </div>
      </section>

      <section class="payment-step amount-step payment-panel" id="panel-robux" role="tabpanel" aria-labelledby="tab-robux">
        <h2><span>2.</span> Enter amount of Robux:</h2>
        <form class="amount-form" id="amount-form">
          <label for="robux-amount">Robux amount</label>
          <div class="amount-input"><span>R$</span><input id="robux-amount" name="amount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Example: 4500" required><button class="search-button" type="submit" aria-label="Search"><span class="search-icon" aria-hidden="true"></span><span class="visually-hidden">Search</span></button></div>
        </form>
        <div class="calculation-result" id="calculation-result" aria-live="polite"></div>
      </section>

      <section class="payment-step payment-panel" id="panel-paypal" role="tabpanel" aria-labelledby="tab-paypal" hidden>
        <h2><span>2.</span> Pay with PayPal:</h2>
        <p class="step-description">This method can be enabled once your PayPal link has been added.</p>
        <!-- Replace # with your PayPal link when it is ready. -->
        <a class="paypal-link disabled" href="#" aria-disabled="true">PayPal — coming soon</a>
      </section>

    </main>
  </div>
</body>
</html>
